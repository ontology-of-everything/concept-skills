- id: settle-the-concept-design
  path: skills/en/settle-the-concept-design
  display_name: "Prepare concept proposals"
  display_title: "Prepare concept proposals"
  display_name_zh: "整理概念方案"
  display_title_zh: "整理概念方案"
  domain: concept-design
  summary: "Use when explicitly invoked to consolidate a concept-design discussion. Organize goals, options, tradeoffs, consequences, and acceptance criteria. Preserve confirmation status, distinguishing confirmed decisions, suggestions, and unresolved matters."
  summary_zh: "仅在显式调用时使用。需要收敛概念设计讨论时使用。整理目标、方案、取舍、影响与验收条件，保留确认状态，区分已确认决定、建议和未决事项。"
  version: "0.1.5"
  agents: [cursor, claude-code, codex, openclaw]
  compatibility: Uses the supplied discussion and design materials; no required runtime dependencies.
  marketplaces: [skills-sh, skillsmp, clawhub]
