version: 1
domains:
  concept-design:
    name: Concept Design
    name_zh: 概念设计
    description: Organize software into independent concepts and explicit synchronization rules so behavior is easier to understand and change.
    description_zh: 用独立概念与明确同步规则组织软件，让行为更容易理解与修改。
  semantic-modeling:
    name: Semantic Modeling
    name_zh: 语义建模
    description: Model the business meaning of data, facts, dimensions, and relations.
    description_zh: 定义数据、事实、维度与关系的业务含义。
  knowledge-management:
    name: Knowledge Management
    name_zh: 知识管理
    description: Extract, connect, organize, and reuse knowledge from source material.
    description_zh: 从原文萃取、关联、组织和复用知识。
  learning-methods:
    name: Learning Methods
    name_zh: 学习方法
    description: Build and revise understanding around a learning goal and a key framework.
    description_zh: 围绕学习目标与关键框架建立并修正理解。
  software-architecture:
    name: Software Architecture
    name_zh: 软件架构
    description: Explain system structure and behavior through diagrams and text.
    description_zh: 用图文说明系统的组成、联系与运行方式。
skills:
- id: concept-design
  path: skills/en/concept-design
  display_name: Concept Design — Modular, Legible Software
  display_title: Concept Design — Modular, Legible Software
  display_name_zh: 概念设计：模块独立，协作清楚
  display_title_zh: 概念设计：模块独立，协作清楚
  domain: concept-design
  summary: Use only when explicitly invoked for software design, specifications, implementation, review, refactoring, or explanation with Daniel Jackson's concepts and synchronizations. Put functionality in independent modules and coordination in explicit rules to make software more modular, transparent, and easier to understand and change. Check CONCEPT.md/SYNCS.md structure and generate Mermaid relationship maps.
  summary_zh: 仅在显式调用时，用 Daniel Jackson 的概念与同步方法设计、写规格、实现、审查、重构或解释软件。将功能放进独立模块，将协作写成明确规则，让软件更模块化、行为更透明、更容易理解与修改。支持 CONCEPT.md/SYNCS.md 结构检查与 Mermaid 关系图。
  version: 2.0.1
  agents:
  - cursor
  - claude-code
  - codex
  - openclaw
  compatibility: File access. Format checks use Python 3 standard library.
  marketplaces:
  - skills-sh
  - skillsmp
  - clawhub
  distribution: direct-skill
  clawhub_license: MIT-0 on ClawHub; repository source remains Apache-2.0
  language: en
  translation_of: concept-design-cn
  clawhub:
    categories:
    - development
    - knowledge
    topics:
    - concept-design
    - software-architecture
    - synchronizations
    - requirements
    - verification
