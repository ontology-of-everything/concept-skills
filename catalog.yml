version: 1
domains:
  code-maintenance:
    name: Code Maintenance
    name_zh: 代码维护
    description: Simplify Java / Spring Boot code while preserving behavior and useful boundaries.
    description_zh: 保留行为与有用边界，简化 Java / Spring Boot 代码。
  concept-design:
    name: Concept design
    name_zh: 概念设计
    description: Define independent functionality with concepts and coordinate them with synchronization rules.
    description_zh: 用概念定义独立功能，用同步规则定义概念之间的协作。
  semantic-modeling:
    name: Semantic Modeling
    name_zh: 语义建模
    description: Model the business meaning of data, facts, dimensions, and relations.
    description_zh: 定义数据、事实、维度与关系的业务含义。
  knowledge-management:
    name: Knowledge Management
    name_zh: 知识管理
    description: Extract, connect, organize, and reuse knowledge from source material.
    description_zh: 从原文萃取、关联、组织和复用知识。
  learning-methods:
    name: Learning Methods
    name_zh: 学习方法
    description: Build and revise understanding around a learning goal and a key framework.
    description_zh: 围绕学习目标与关键框架建立并修正理解。
  software-architecture:
    name: Software Architecture
    name_zh: 软件架构
    description: Core concepts, definitions, principles, and common mistakes in software architecture models.
    description_zh: 软件架构模型的核心概念、定义、原则与常见误用。
  engineering:
    name: Agent CLI engineering
    name_zh: 面向智能体的 CLI 工程
    description: Predictable, defensible CLI design, review, and refactoring.
    description_zh: 以可预测性、纵深防御和上下文效率指导 CLI 设计、审查与重构。
