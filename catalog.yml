# Public skill index and per-skill versions. Keep in sync with skills/.
version: 1
domains:
  concept-design:
    name: Concept Design
    name_zh: 概念设计
    description: Design software concepts, responsibilities, specifications, and implementations.
    description_zh: 设计软件概念、职责、规格与实现。
  semantic-modeling:
    name: Semantic Modeling
    name_zh: 语义建模
    description: Model the business meaning of data, facts, dimensions, and relations.
    description_zh: 定义数据、事实、维度与关系的业务含义。
  knowledge-management:
    name: Knowledge Management
    name_zh: 知识管理
    description: Extract, connect, organize, and reuse knowledge from source material.
    description_zh: 从原文萃取、关联、组织和复用知识。
  learning-methods:
    name: Learning Methods
    name_zh: 学习方法
    description: Build and revise understanding around a learning goal and a key framework.
    description_zh: 围绕学习目标与关键框架建立并修正理解。
